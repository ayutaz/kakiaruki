<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Phaser 4とPhaser Box2Dによる一筆進化Web版のP0技術検証"
    />
    <title>One Stroke Evolution Web - P0</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">P0 TECHNICAL SPIKE</p>
        <h1>2本の骨と、ひとつの関節。</h1>
        <p>
          Phaser 4で描画し、Phaser Box2Dを固定ステップで進めています。
          モーターと角度制限を切り替えて、物理配線の差を確認できます。
        </p>
      </header>

      <section class="workbench" aria-label="物理技術検証">
        <div id="game" class="canvas-frame" aria-label="Box2D技術検証キャンバス"></div>

        <aside class="panel">
          <div class="metric">
            <span>状態</span>
            <strong id="status">初期化中</strong>
          </div>
          <div class="metric">
            <span>関節角度</span>
            <strong id="joint-angle">0.000 rad</strong>
          </div>
          <div class="metric">
            <span>目標角度</span>
            <strong id="target-angle">0.000 rad</strong>
          </div>

          <div class="controls">
            <button id="motor-toggle" type="button" aria-pressed="true">
              モーター: ON
            </button>
            <button id="limit-toggle" type="button" aria-pressed="true">
              角度制限: ON
            </button>
            <label for="speed">シミュレーション速度</label>
            <select id="speed">
              <option value="1">x1</option>
              <option value="2">x2</option>
              <option value="4">x4</option>
              <option value="8">x8</option>
            </select>
            <button id="reset" class="secondary" type="button">初期状態へ戻す</button>
          </div>

          <p class="note">
              水色は固定骨、黄色は動的骨です。角度制限ONではおおむね±0.35 rad付近に留まり、OFFでは広い振幅を追従します。
          </p>
        </aside>
      </section>

      <footer>
        <span>Phaser 4.2.1</span>
        <span>Phaser Box2D 1.1.0</span>
        <span>fixed dt 1/60 s</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
